@keyframes c01{0%{transform:translateX(0)} 8.095%{transform:translateX(0);animation-timing-function:steps(59,end)} 14.762%{transform:translateX(590px)} 33.238%{transform:translateX(590px)} 33.333%{transform:translateX(0)} 100%{transform:translateX(0)}} .c01{animation:c01 21.0s infinite linear}
