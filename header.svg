@keyframes c21{0%{transform:translateX(0)} 74.762%{transform:translateX(0);animation-timing-function:steps(53,end)} 81.429%{transform:translateX(533px)} 99.905%{transform:translateX(533px)} 100.000%{transform:translateX(0)} 100%{transform:translateX(0)}} .c21{animation:c21 21.0s infinite linear}
@keyframes c22{0%{transform:translateX(0)} 81.429%{transform:translateX(0);animation-timing-function:steps(58,end)} 88.095%{transform:translateX(581px)} 99.905%{transform:translateX(581px)} 100.000%{transform:translateX(0)} 100%{transform:translateX(0)}} .c22{animation:c22 21.0s infinite linear}
