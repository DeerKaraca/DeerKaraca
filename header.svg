<defs><clipPath id="area"><rect x="30" y="160" width="800" height="130"/></clipPath></defs>
<rect class="bg" x="0" y="0" width="860" height="300" rx="12"/>
<rect class="frame" x="0.5" y="0.5" width="859" height="299" rx="12"/>
<text class="name" x="36" y="72">Karaca</text>
<text class="role" x="36" y="102">Machine learning engineer focused on LLMs, from raw data to production APIs</text>
<circle cx="40" cy="127" r="4" fill="#2E9E62"/>
<text class="status" x="52" y="132">Open to ML Engineer, AI Engineer and Applied AI Engineer roles</text>
<line x1="36" y1="154" x2="824" y2="154" stroke="#23262D"/>
<g clip-path="url(#area)">
<g class="g0">
<text class="code" x="36" y="186">model.generate("Who is Karaca?", temperature=0.2)</text>
<text class="mode" x="824" y="186" text-anchor="end">sampling: precise</text>
<text class="out" x="36" y="220">Machine learning engineer focused on large language models.</text>
<rect class="cover c00" x="32" y="203" width="800" height="24"/>
<text class="out" x="36" y="246">I build end-to-end pipelines: data, fine-tuning, evaluation</text>
<rect class="cover c01" x="32" y="229" width="800" height="24"/>
<text class="out" x="36" y="272">and deployment, with PyTorch, Hugging Face, FastAPI and Docker.</text>
<rect class="cover c02" x="32" y="255" width="800" height="24"/>
</g>
<g class="g1">
<text class="code" x="36" y="186">model.generate("Who is Karaca?", temperature=0.8)</text>
<text class="mode" x="824" y="186" text-anchor="end">sampling: balanced</text>
<text class="out" x="36" y="220">I train language models, then do the less glamorous part:</text>
<rect class="cover c10" x="32" y="203" width="800" height="24"/>
<text class="out" x="36" y="246">making them work outside a notebook. Clean data in, fine-tuned</text>
<rect class="cover c11" x="32" y="229" width="800" height="24"/>
<text class="out" x="36" y="272">model out, evaluated against a baseline, served behind an API.</text>
<rect class="cover c12" x="32" y="255" width="800" height="24"/>
</g>
<g class="g2">
<text class="code" x="36" y="186">model.generate("Who is Karaca?", temperature=1.4)</text>
<text class="mode" x="824" y="186" text-anchor="end">sampling: creative</text>
<text class="out" x="36" y="220">I teach language models new tricks, then make sure they still</text>
<rect class="cover c20" x="32" y="203" width="800" height="24"/>
<text class="out" x="36" y="246">behave in production. Loss goes down, coffee goes up.</text>
<rect class="cover c21" x="32" y="229" width="800" height="24"/>
<text class="out" x="36" y="272">Ask me about LoRA, RAG, or why the test set is off-limits.</text>
<rect class="cover c22" x="32" y="255" width="800" height="24"/>
</g>
</g>
</svg>