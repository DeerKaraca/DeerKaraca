<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Karaca, machine learning engineer</title>
<desc id="d">An animated bio being generated token by token at three sampling temperatures.</desc>
<style>
