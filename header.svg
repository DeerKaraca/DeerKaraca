@keyframes g1{0%{opacity:0} 33.333%{opacity:0} 33.381%{opacity:1} 64.762%{opacity:1} 66.667%{opacity:0} 100%{opacity:0}} .g1{animation:g1 21.0s infinite}
@keyframes c10{0%{transform:translateX(0)} 34.762%{transform:translateX(0);animation-timing-function:steps(57,end)} 41.429%{transform:translateX(571px)} 66.571%{transform:translateX(571px)} 66.667%{transform:translateX(0)} 100%{transform:translateX(0)}} .c10{animation:c10 21.0s infinite linear}
@keyframes c11{0%{transform:translateX(0)} 41.429%{transform:translateX(0);animation-timing-function:steps(62,end)} 48.095%{transform:translateX(619px)} 66.571%{transform:translateX(619px)} 66.667%{transform:translateX(0)} 100%{transform:translateX(0)}} .c11{animation:c11 21.0s infinite linear}
